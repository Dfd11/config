# ==============================================================================
# GENERAL SETTINGS & USABILITY
# ==============================================================================

# Enable mouse mode (allows resizing panes, clicking tabs, and scrolling)
set -g mouse on

# Start window and pane indexing at 1 instead of 0 (easier to reach on keyboard)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Increase scrollback history limit
set -g history-limit 10000

# Fix terminal colors (ensures Zsh themes and Neovim look correct)
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# Don't rename windows automatically (keeps your custom names intact)
set-option -g allow-rename off

# ==============================================================================
# KEYBINDINGS
# ==============================================================================

# Remap split panes to use logical visual keys: | and -
# Also sets new splits to open in the current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload tmux configuration file quickly
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Switch panes easily using Alt + Arrow keys WITHOUT the prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ==============================================================================
# PLUGINS (Managed via TPM)
# ==============================================================================
setw -g mode-keys vi
unbind-key -T copy-mode-vi Space
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
# List of plugins
set -g @plugin 'tmux-plugins/tpm'          # The Plugin Manager itself
set -g @plugin 'tmux-plugins/tmux-sensible' # Common baseline community settings

# The LazyVim 'which-key' clone for popup menu guides
set -g @plugin 'alexwforsythe/tmux-which-key'
# Plugin to save sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'
# (Optional) Clean theme to make the bottom status bar look nice
set -g @plugin 'seebi/tmux-colors-solarized'
set -g @colors-solarized 'dark'

# Initialize TMUX plugin manager (ALWAYS KEEP THIS LINE AT THE VERY BOTTOM)
run '~/.tmux/plugins/tpm/tpm'
